[build]
  command = "npm run build"
  publish = "dist/public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/workshops"
  to = "/workshops/index.html"
  status = 200

[[redirects]]
  from = "/book"
  to = "/book/index.html"
  status = 200

[[redirects]]
  from = "/payment"
  to = "/payment/index.html"
  status = 200

[[redirects]]
  from = "/atmospheric"
  to = "/atmospheric/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "@neondatabase/serverless"]
